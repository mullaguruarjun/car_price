<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real-Time Object Detection</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <!-- COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        h1 {
            margin: 25px 0 10px;
        }

        #status {
            color: #9ca3af;
            margin-bottom: 20px;
        }

        .controls {
            margin-bottom: 20px;
        }

        button {
            padding: 12px 22px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            color: white;
        }

        #startBtn {
            background: #16a34a;
        }

        #stopBtn {
            background: #dc2626;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #container {
            position: relative;
            display: inline-block;
            max-width: 90%;
        }

        #video {
            display: block;
            width: 800px;
            max-width: 100%;
            border-radius: 12px;
            background: black;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #detections {
            width: 800px;
            max-width: 90%;
            margin: 20px auto;
            padding: 15px;
            background: #1f2937;
            border-radius: 10px;
            text-align: left;
        }

        .detection {
            padding: 8px;
            border-bottom: 1px solid #374151;
        }

        .detection:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

    <h1>🤖 Real-Time Object Detection</h1>

    <div id="status">
        Loading COCO-SSD model...
    </div>

    <div class="controls">
        <button id="startBtn" disabled>
            ▶ Start Camera
        </button>

        <button id="stopBtn" disabled>
            ⏹ Stop Camera
        </button>
    </div>

    <div id="container">

        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="canvas"></canvas>

    </div>

    <div id="detections">
        <strong>Detected Objects</strong>

        <div id="detectionList">
            No objects detected.
        </div>
    </div>


<script>

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    const statusText = document.getElementById("status");
    const detectionList = document.getElementById("detectionList");

    let model = null;
    let stream = null;
    let detecting = false;


    // ------------------------------------
    // Load COCO-SSD model
    // ------------------------------------

    async function loadModel() {

        try {

            statusText.textContent =
                "Loading COCO-SSD model...";

            model = await cocoSsd.load();

            statusText.textContent =
                "Model loaded. Ready to start camera.";

            startBtn.disabled = false;

        } catch (error) {

            console.error(error);

            statusText.textContent =
                "Failed to load model.";

        }

    }


    // ------------------------------------
    // Start Camera
    // ------------------------------------

    async function startCamera() {

        if (!model) {
            alert("Model is still loading.");
            return;
        }

        try {

            stream = await navigator.mediaDevices.getUserMedia({

                video: {
                    width: 800,
                    height: 600,
                    facingMode: "environment"
                },

                audio: false

            });

            video.srcObject = stream;

            await video.play();

            detecting = true;

            startBtn.disabled = true;
            stopBtn.disabled = false;

            statusText.textContent =
                "Camera running — detecting objects...";

            detectObjects();

        } catch (error) {

            console.error(error);

            alert(
                "Unable to access camera.\n\n" +
                "Please allow camera permission."
            );

        }

    }


    // ------------------------------------
    // Stop Camera
    // ------------------------------------

    function stopCamera() {

        detecting = false;

        if (stream) {

            stream.getTracks().forEach(track => {
                track.stop();
            });

            stream = null;
        }

        video.srcObject = null;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        detectionList.innerHTML =
            "No objects detected.";

        startBtn.disabled = false;
        stopBtn.disabled = true;

        statusText.textContent =
            "Camera stopped.";

    }


    // ------------------------------------
    // Object Detection
    // ------------------------------------

    async function detectObjects() {

        if (!detecting) {
            return;
        }

        if (video.readyState !== 4) {

            requestAnimationFrame(detectObjects);

            return;
        }


        // Make canvas match video resolution

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;


        // Run COCO-SSD detection

        const predictions =
            await model.detect(video);


        // Clear previous boxes

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // Filter low-confidence detections

        const objects =
            predictions.filter(
                prediction => prediction.score >= 0.50
            );


        // Draw bounding boxes

        objects.forEach(prediction => {

            const [
                x,
                y,
                width,
                height
            ] = prediction.bbox;


            // Box

            ctx.strokeStyle = "#00ff00";
            ctx.lineWidth = 3;

            ctx.strokeRect(
                x,
                y,
                width,
                height
            );


            // Label background

            const label =
                `${prediction.class} ` +
                `${(prediction.score * 100).toFixed(1)}%`;

            ctx.font =
                "18px Arial";

            const textWidth =
                ctx.measureText(label).width;


            ctx.fillStyle =
                "#00ff00";

            ctx.fillRect(
                x,
                y - 28,
                textWidth + 10,
                28
            );


            // Label text

            ctx.fillStyle =
                "#000000";

            ctx.fillText(
                label,
                x + 5,
                y - 8
            );

        });


        // Update detection list

        updateDetectionList(objects);


        // Continue detection

        if (detecting) {

            requestAnimationFrame(
                detectObjects
            );

        }

    }


    // ------------------------------------
    // Update Detection List
    // ------------------------------------

    function updateDetectionList(objects) {

        if (objects.length === 0) {

            detectionList.innerHTML =
                "No objects detected.";

            return;

        }


        detectionList.innerHTML =
            objects.map(object => {

                const confidence =
                    (object.score * 100).toFixed(1);

                return `
                    <div class="detection">
                        🟢
                        <strong>
                            ${object.class}
                        </strong>

                        —
                        ${confidence}%
                    </div>
                `;

            }).join("");

    }


    // ------------------------------------
    // Button Events
    // ------------------------------------

    startBtn.addEventListener(
        "click",
        startCamera
    );

    stopBtn.addEventListener(
        "click",
        stopCamera
    );


    // ------------------------------------
    // Load model when page starts
    // ------------------------------------

    loadModel();

</script>

</body>
</html>
